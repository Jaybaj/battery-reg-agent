services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: battery-reg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-battery_reg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-battery_reg}
      POSTGRES_DB: ${POSTGRES_DB:-battery_reg}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-battery_reg}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
